onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

# Matches the pane-border accent so the focused Space/Agent row in the
# sidebar reads as clearly as the focused pane frame does.
active_row_bg = "#313244"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
# Ctrl+T is the primary prefix; Ctrl+Space stays live as a fallback during
# the transition (fzf's file widget moved to Ctrl+G in shell/.bashrc, and
# pi's thinking-block toggle moved to Ctrl+Shift+T, to free Ctrl+T here).
prefix = ["ctrl+t", "ctrl+space"]

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"
# Clears screen+scrollback without sending input to the running process.
clear_pane = "prefix+ctrl+k"

focus_pane_left = "alt+left"
focus_pane_down = "alt+down"
focus_pane_up = "alt+up"
focus_pane_right = "alt+right"

# Keyboard pane resizing is disabled in favor of mouse drag on split
# borders. resize_mode defaults to prefix+r, which would otherwise collide
# with rename_tab, so it's explicitly unbound rather than left unset.
resize_mode = []

# Resize via mouse drag on split borders instead - keyboard resize disabled.
resize_pane_left = []
resize_pane_down = []
resize_pane_up = []
resize_pane_right = []

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Agents - cut across every workspace and tab, unlike panes/tabs/workspaces
previous_agent = "alt+shift+up"
next_agent = "alt+shift+down"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "ctrl+alt+left"]
next_tab = ["prefix+n", "ctrl+alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
# Moved off herdr's own default (prefix+shift+k), which silently shadowed
# swap_pane_up with no warning - see omacom/omarchy#10062.
close_workspace = "prefix+shift+d"
previous_workspace = ["prefix+shift+p", "ctrl+alt+up"]
next_workspace = ["prefix+shift+n", "ctrl+alt+down"]
# Jump to workspace 1-9 directly, mirroring switch_tab above.
switch_workspace = "prefix+shift+1..9"

# Worktrees: new_worktree keeps herdr's default (prefix+shift+g); these two
# have no default binding.
open_worktree = "prefix+shift+w"
remove_worktree = "prefix+shift+x"

# Ctrl+Alt+1..9 jumps straight to agent N, in the agent sidebar's order.
[keys.indexed]
agents = "ctrl+alt"

[ui]
# High-contrast accent so the focused pane's frame and label are unmistakable
# (was "blue", too close to the default terminal palette to stand out).
accent = "#f9e2af"

# Frame every pane, including a lone one, and show its agent name in the
# border so focus is visible without relying on color alone.
pane_borders = "always"
pane_outer_borders = true
show_agent_labels_on_pane_borders = true

# tmux drew single-line dividers between adjacent panes and no outer frame;
# traded for visually distinct boxes now that pane_borders is "always".
pane_gaps = true

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

status_indicators = "symbols"
[ui.toast]
delivery = "terminal"
